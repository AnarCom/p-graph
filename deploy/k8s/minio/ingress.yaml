apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-service
  namespace: pgraph
spec:
  ingressClassName: nginx
  rules:
    - host: minio.local
      http:
        paths:
          - backend:
              service:
                name: minio-service
                port:
                  number: 9001
            path: /
            pathType: Prefix
