apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver
  namespace: pgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apiserver
  template:
    metadata:
      labels:
        app: apiserver
    spec:
      containers:
        - image: {{ .Values.apiserver.image }}
          imagePullPolicy: IfNotPresent
          name: apiserver
          env:
            - name: CONFIG_PATH
              value: /etc/apiserver/apiserver.yaml
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: apiserver-config
              mountPath: /etc/apiserver
              readOnly: true
      volumes:
        - name: apiserver-config
          configMap:
            name: apiserver-file-config
