apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apiserver-ingress
  namespace: pgraph
spec:
  ingressClassName: nginx
  rules:
    - host: apiserver.local
      http:
        paths:
          - backend:
              service:
                name: apiserver-service
                port:
                  number: 8080
            path: /
            pathType: Prefix
